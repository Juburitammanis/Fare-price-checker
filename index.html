<!DOCTYPEhtml>
<htmllang="en">

<head>

<metacharset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>CommunityFareChecker</title>


<!--LEAFLETCSS-->

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>


<style>

*{
box-sizing:border-box;
}


body{
margin:0;
background:#f5f5f5;
color:#111;
font-family:
-apple-system,
BlinkMacSystemFont,
"SegoeUI",
sans-serif;
}


/*HEADER*/

header{
background:#111;
color:white;
padding:18px16px;
}


headerh1{
margin:0;
font-size:21px;
font-weight:800;
}


headerp{
margin:4px00;
font-size:12px;
opacity:.7;
}


/*MAIN*/

.container{
max-width:720px;
margin:auto;
padding:12px;
}


/*CARD*/

.card{
background:white;
border-radius:16px;
padding:14px;
margin-bottom:12px;
box-shadow:
02px12pxrgba(0,0,0,.06);
}


/*LOCATION*/

.label{
font-size:11px;
font-weight:800;
color:#666;
margin-bottom:6px;
letter-spacing:.4px;
}


.search-row{
display:flex;
gap:8px;
margin-bottom:12px;
}


.search-box{
flex:1;
position:relative;
}


input{
width:100%;
height:48px;
border:
1pxsolid#ddd;
border-radius:12px;
padding:
013px;
font-size:14px;
outline:none;
background:white;
}


input:focus{
border-color:#111;
}


.location-btn{
width:48px;
height:48px;
padding:0;
background:#eee;
font-size:19px;
}


/*SUGGESTIONS*/

.suggestions{
position:absolute;
left:0;
right:0;
top:52px;

background:white;

border:
1pxsolid#ddd;

border-radius:12px;

box-shadow:
08px25pxrgba(0,0,0,.15);

z-index:9999;

overflow:hidden;
}


.suggestion{
padding:12px;
border-bottom:
1pxsolid#eee;

font-size:13px;
line-height:1.35;

cursor:pointer;
}


.suggestion:last-child{
border-bottom:0;
}


.suggestion:active{
background:#eee;
}


/*MAP*/

#map{
width:100%;
height:440px;
border-radius:14px;
overflow:hidden;
}


.map-help{
text-align:center;
margin-top:8px;
color:#777;
font-size:11px;
}


/*BUTTON*/

button{
border:0;
border-radius:11px;
font-weight:700;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}


.black-btn{
width:100%;
height:50px;
background:#111;
color:white;
font-size:15px;
}


/*ROUTEINFO*/

#routeInfo{
display:none;
}


.route-grid{
display:grid;
grid-template-columns:
1fr1fr;

gap:8px;
}


.route-box{
background:#f3f3f3;
border-radius:12px;
padding:14px;
text-align:center;
}


.route-value{
font-size:23px;
font-weight:900;
}


.route-label{
font-size:10px;
color:#777;
margin-top:3px;
}


/*STATUS*/

#status{
display:none;

margin-top:10px;

padding:11px;

border-radius:10px;

background:#f1f1f1;

font-size:12px;

text-align:center;
}


#error{
display:none;

margin-top:10px;

padding:11px;

border-radius:10px;

background:#fff0f0;

color:#a00000;

font-size:12px;
}


@media(max-width:430px){

#map{
height:390px;
}

}

</style>

</head>


<body>


<header>

<h1>
CommunityFareChecker
</h1>

<p>
Bruneicommunityroute&farereference
</p>

</header>


<divclass="container">


<!--LOCATIONCARD-->

<divclass="card">


<divclass="label">
PICKUP
</div>


<divclass="search-row">

<divclass="search-box">

<input
id="pickup"
type="text"
placeholder="Searchpickuplocation"
autocomplete="off"
>

<div
id="pickupSuggestions"
class="suggestions"
style="display:none"
></div>

</div>


<button
class="location-btn"
onclick="useMyLocation('pickup')"
title="Usemylocation"
>
📍
</button>

</div>


<divclass="label">
GOINGTO
</div>


<divclass="search-row">

<divclass="search-box">

<input
id="destination"
type="text"
placeholder="Searchdestination"
autocomplete="off"
>

<div
id="destinationSuggestions"
class="suggestions"
style="display:none"
></div>

</div>


<button
class="location-btn"
onclick="useMyLocation('destination')"
title="Usemylocation"
>
📍
</button>

</div>


</div>


<!--MAP-->

<divclass="card">

<divid="map"></div>


<divclass="map-help">

Tapthemaptoplaceapin.
Dragpinstoadjustexactlocations.

</div>

</div>


<!--ROUTE-->

<divclass="card">


<button
class="black-btn"
onclick="getRoute()"
>
🚗CalculateRoute
</button>


<div
id="status"
>
Calculatingdrivingroute...
</div>


<div
id="error"
></div>

</div>


<!--ROUTERESULT-->

<div
id="routeInfo"
class="card"
>


<divclass="route-grid">


<divclass="route-box">

<div
id="distance"
class="route-value"
>
-
</div>

<divclass="route-label">
DRIVINGDISTANCE
</div>

</div>


<divclass="route-box">

<div
id="time"
class="route-value"
>
-
</div>

<divclass="route-label">
ESTIMATEDTIME
</div>

</div>


</div>


</div>


</div>


<!--LEAFLETJS-->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>


/*=========================================================
DEFAULTBRUNEILOCATION
=========================================================*/

constBRUNEI_CENTER=[
4.9031,
114.9398
];


/*=========================================================
MAP
=========================================================*/

constmap=
L.map("map")
.setView(
BRUNEI_CENTER,
12
);


/*=========================================================
OPENSTREETMAP
=========================================================*/

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,

attribution:
'&copy;OpenStreetMapcontributors'
}
).addTo(map);


/*=========================================================
MAPSIZEFIX
=========================================================*/

setTimeout(
function(){

map.invalidateSize();

},
500
);


/*=========================================================
VARIABLES
=========================================================*/

letpickupMarker=null;

letdestinationMarker=null;

letpickupCoords=null;

letdestinationCoords=null;

letrouteLine=null;


/*=========================================================
PINICON
=========================================================*/

functionmakeIcon(label){

returnL.divIcon({

className:"",

html:`

<divstyle="
display:flex;
flex-direction:column;
align-items:center;
">

<divstyle="
background:#111;
color:white;
padding:4px7px;
border-radius:7px;
font-size:10px;
font-weight:800;
white-space:nowrap;
box-shadow:02px6pxrgba(0,0,0,.3);
">
${label}
</div>

<divstyle="
width:18px;
height:18px;
background:#111;
border:3pxsolidwhite;
border-radius:50%;
margin-top:3px;
box-shadow:02px6pxrgba(0,0,0,.3);
"></div>

</div>

`,

iconSize:[
80,
42
],

iconAnchor:[
40,
38
]

});

}


/*=========================================================
SETPICKUP
=========================================================*/

functionsetPickup(
lat,
lon,
name
){


pickupCoords=[
lat,
lon
];


if(pickupMarker){

map.removeLayer(
pickupMarker
);

}


pickupMarker=
L.marker(
[lat,lon],
{
draggable:true,

icon:
makeIcon("PICKUP")
}
)
.addTo(map);


pickupMarker.on(
"dragend",
asyncfunction(){

constpos=
pickupMarker.getLatLng();


pickupCoords=[
pos.lat,
pos.lng
];


document.getElementById(
"pickup"
).value=
"Selectedlocation";


try{

constaddress=
awaitreverseGeocode(
pos.lat,
pos.lng
);

document.getElementById(
"pickup"
).value=
address;

}catch{}

}
);


document.getElementById(
"pickup"
).value=
name||
"Selectedlocation";


map.setView(
[lat,lon],
15
);

}


/*=========================================================
SETDESTINATION
=========================================================*/

functionsetDestination(
lat,
lon,
name
){


destinationCoords=[
lat,
lon
];


if(destinationMarker){

map.removeLayer(
destinationMarker
);

}


destinationMarker=
L.marker(
[lat,lon],
{
draggable:true,

icon:
makeIcon("DESTINATION")
}
)
.addTo(map);


destinationMarker.on(
"dragend",
asyncfunction(){

constpos=
destinationMarker.getLatLng();


destinationCoords=[
pos.lat,
pos.lng
];


document.getElementById(
"destination"
).value=
"Selectedlocation";


try{

constaddress=
awaitreverseGeocode(
pos.lat,
pos.lng
);

document.getElementById(
"destination"
).value=
address;

}catch{}

}
);


document.getElementById(
"destination"
).value=
name||
"Selectedlocation";


map.setView(
[lat,lon],
15
);

}


/*=========================================================
REVERSEGEOCODING
=========================================================*/

asyncfunctionreverseGeocode(
lat,
lon
){


consturl=
"https://nominatim.openstreetmap.org/reverse?"+

newURLSearchParams({

format:
"jsonv2",

lat:
lat,

lon:
lon,

zoom:
18,

"accept-language":
"en"

});


constresponse=
awaitfetch(url);


if(!response.ok){

thrownewError(
"Unabletoidentifylocation."
);

}


constdata=
awaitresponse.json();


return(
data.display_name||
"Selectedlocation"
);

}


/*=========================================================
SEARCH
=========================================================*/

functionsetupSearch(
inputId,
suggestionId,
type
){


constinput=
document.getElementById(
inputId
);


constbox=
document.getElementById(
suggestionId
);


lettimer=null;


input.addEventListener(
"input",
function(){


constquery=
input.value.trim();


clearTimeout(
timer
);


if(
query.length<3
){

box.style.display=
"none";

return;

}


timer=
setTimeout(
asyncfunction(){


box.style.display=
"block";


box.innerHTML=
`
<divclass="suggestion">
SearchingBrunei...
</div>
`;


try{


consturl=
"https://nominatim.openstreetmap.org/search?"+

newURLSearchParams({

format:
"jsonv2",

q:
query+
",Brunei",

countrycodes:
"bn",

limit:
5,

addressdetails:
1,

"accept-language":
"en"

});


constresponse=
awaitfetch(url);


if(!response.ok){

thrownewError(
"Searchfailed."
);

}


constresults=
awaitresponse.json();


box.innerHTML=
"";


if(
results.length===0
){

box.innerHTML=
`
<divclass="suggestion">
Nolocationfound
</div>
`;

return;

}


results.forEach(
function(result){


constitem=
document.createElement(
"div"
);


item.className=
"suggestion";


item.textContent=
result.display_name;


item.onclick=
function(){


constlat=
parseFloat(
result.lat
);


constlon=
parseFloat(
result.lon
);


if(
type===
"pickup"
){

setPickup(
lat,
lon,
result.display_name
);

}else{

setDestination(
lat,
lon,
result.display_name
);

}


box.style.display=
"none";

};


box.appendChild(
item
);

}
);


}catch(error){


box.innerHTML=
`
<divclass="suggestion">
Searchunavailable.
</div>
`;

}


},
1200
);

}
);

}


/*=========================================================
STARTSEARCH
=========================================================*/

setupSearch(
"pickup",
"pickupSuggestions",
"pickup"
);


setupSearch(
"destination",
"destinationSuggestions",
"destination"
);


/*=========================================================
MYLOCATION
=========================================================*/

window.useMyLocation=
function(type){


if(
!navigator.geolocation
){

showError(
"Locationservicesarenotsupported."
);

return;

}


showStatus(
"Gettingyourlocation..."
);


navigator.geolocation.getCurrentPosition(

asyncfunction(position){


constlat=
position.coords.latitude;


constlon=
position.coords.longitude;


letname=
"MyLocation";


try{

name=
awaitreverseGeocode(
lat,
lon
);

}catch{}


if(
type===
"pickup"
){

setPickup(
lat,
lon,
name
);

}else{

setDestination(
lat,
lon,
name
);

}


hideStatus();

},


function(){


hideStatus();


showError(
"Unabletogetyourlocation.Pleaseallowlocationaccess."
);

},


{
enableHighAccuracy:
true,

timeout:
10000,

maximumAge:
30000

}

);

};


/*=========================================================
MAPTAP
=========================================================*/

map.on(
"click",
asyncfunction(event){


constlat=
event.latlng.lat;


constlon=
event.latlng.lng;


/*
Firsttap:
pickup

Secondtap:
destination

Furthertaps:
destinationmoves
*/


if(!pickupCoords){


setPickup(
lat,
lon,
"Selectedlocation"
);


try{

constaddress=
awaitreverseGeocode(
lat,
lon
);


document.getElementById(
"pickup"
).value=
address;

}catch{}


return;

}


setDestination(
lat,
lon,
"Selectedlocation"
);


try{

constaddress=
awaitreverseGeocode(
lat,
lon
);


document.getElementById(
"destination"
).value=
address;

}catch{}

}
);


/*=========================================================
ROUTE
=========================================================*/

window.getRoute=
asyncfunction(){


hideError();


if(!pickupCoords){

showError(
"Selectapickuplocationfirst."
);

return;

}


if(!destinationCoords){

showError(
"Selectadestinationfirst."
);

return;

}


showStatus(
"Calculatingdrivingroute..."
);


try{


conststart=
`${pickupCoords[1]},${pickupCoords[0]}`;


constend=
`${destinationCoords[1]},${destinationCoords[0]}`;


constcoordinates=
start+
";"+
end;


consturl=
"https://router.project-osrm.org/route/v1/driving/"+

coordinates+

"?overview=full"+

"&geometries=geojson"+

"&steps=false"+

"&alternatives=false";


constresponse=
awaitfetch(url);


if(!response.ok){

thrownewError(
"Routingserviceunavailable."
);

}


constdata=
awaitresponse.json();


if(
data.code!==
"Ok"
){

thrownewError(
"Nodrivingroutefound."
);

}


constroute=
data.routes[0];


/*REMOVEOLDROUTE*/

if(routeLine){

map.removeLayer(
routeLine
);

}


/*DRAWROUTE*/

routeLine=
L.geoJSON(
route.geometry,
{

style:{

color:
"#111",

weight:
6,

opacity:
1

}

}
)
.addTo(map);


/*FITROUTE*/

map.fitBounds(
routeLine.getBounds(),
{
padding:
[30,30]
}
);


/*DISTANCE*/

constdistanceKm=
route.distance/
1000;


document.getElementById(
"distance"
).textContent=
distanceKm.toFixed(1)+
"km";


/*TIME*/

constminutes=
route.duration/
60;


document.getElementById(
"time"
).textContent=
formatTime(
minutes
);


/*SHOW*/

document.getElementById(
"routeInfo"
).style.display=
"block";


hideStatus();


document.getElementById(
"routeInfo"
).scrollIntoView({
behavior:
"smooth"
});


}catch(error){


hideStatus();


showError(
error.message||
"Unabletocalculateroute."
);

}

};


/*=========================================================
TIMEFORMAT
=========================================================*/

functionformatTime(
minutes
){


minutes=
Math.round(
minutes
);


if(
minutes<60
){

return(
minutes+
"min"
);

}


consthours=
Math.floor(
minutes/60
);


constremaining=
minutes%60;


if(
remaining===0
){

return(
hours+
"hr"
);

}


return(
hours+
"hr"+
remaining+
"min"
);

}


/*=========================================================
STATUS
=========================================================*/

functionshowStatus(
message
){

conststatus=
document.getElementById(
"status"
);


status.textContent=
message;


status.style.display=
"block";

}


functionhideStatus(){

document.getElementById(
"status"
).style.display=
"none";

}


/*=========================================================
ERROR
=========================================================*/

functionshowError(
message
){

consterror=
document.getElementById(
"error"
);


error.textContent=
message;


error.style.display=
"block";

}


functionhideError(){

document.getElementById(
"error"
).style.display=
"none";

}


/*=========================================================
CLOSESEARCHDROPDOWNS
=========================================================*/

document.addEventListener(
"click",
function(event){


if(
!event.target.closest(
".search-box"
)
){


document.getElementById(
"pickupSuggestions"
).style.display=
"none";


document.getElementById(
"destinationSuggestions"
).style.display=
"none";

}

}
);

</script>

</body>
</html>
