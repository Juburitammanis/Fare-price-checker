<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Community Fare Checker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 24px 15px 40px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    /* SERVICE BUTTONS */

    .service-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .service-button {
      border: 1px solid #ddd;
      background: #fff;
      color: #111;
      padding: 14px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .service-button.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }

    .swap {
      width: 100%;
      border: 0;
      background: #eee;
      color: #111;
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .calculate {
      width: 100%;
      border: 0;
      background: #111;
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .loading {
      display: none;
      text-align: center;
      padding: 15px 5px 0;
      color: #666;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: -3px;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 13px;
      border-radius: 11px;
      background: #fff0f0;
      color: #b00020;
      font-size: 13px;
    }

    .result {
      display: none;
    }

    .service-result {
      font-size: 13px;
      font-weight: 700;
      color: #777;
      margin-bottom: 6px;
    }

    .route {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.4;
    }

    .arrow {
      color: #888;
      padding: 0 4px;
    }

    .fare-label {
      margin-top: 22px;
      color: #777;
      font-size: 13px;
    }

    .fare {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.1;
      margin-top: 3px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .stat {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 14px;
    }

    .stat-label {
      color: #777;
      font-size: 12px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      margin-top: 4px;
    }

    .fare-basis {
      margin-top: 15px;
      padding: 13px;
      background: #f7f7f7;
      border-radius: 12px;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Community Fare Checker</h1>

    <div class="subtitle">
      Standard kampong-to-kampong community fare
    </div>

  </div>


  <!-- SERVICE -->

  <div class="card">

    <div class="service-buttons">

      <button
        id="runnerButton"
        class="service-button active"
        onclick="selectService('runner')"
      >
        📦 Runner
      </button>

      <button
        id="rideButton"
        class="service-button"
        onclick="selectService('ride')"
      >
        🚗 Personal Ride
      </button>

    </div>


    <!-- PICKUP -->

    <label for="pickup">
      Pickup Kampong
    </label>

    <select id="pickup">
      <option value="">
        Select pickup kampong
      </option>
    </select>


    <!-- SWAP -->

    <button
      class="swap"
      onclick="swapLocations()"
    >
      ⇅ Swap Locations
    </button>


    <!-- DESTINATION -->

    <label for="destination">
      Destination Kampong
    </label>

    <select id="destination">
      <option value="">
        Select destination kampong
      </option>
    </select>


    <button
      id="calculateButton"
      class="calculate"
      onclick="calculateFare()"
    >
      Calculate Runner Fare
    </button>


    <div
      id="loading"
      class="loading"
    >
      <span class="spinner"></span>
      Calculating actual road distance...
    </div>


    <div
      id="error"
      class="error"
    ></div>

  </div>


  <!-- RESULT -->

  <div
    id="result"
    class="card result"
  >

    <div
      class="service-result"
      id="serviceResult"
    >
      RUNNER
    </div>


    <div class="route">

      <span id="pickupName"></span>

      <span class="arrow">→</span>

      <span id="destinationName"></span>

    </div>


    <div class="fare-label">
      Standard Community Fare
    </div>


    <div
      class="fare"
      id="fare"
    >
      BND $5.00
    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          Actual Road Distance
        </div>

        <div
          id="distance"
          class="stat-value"
        >
          -
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Estimated Drive Time
        </div>

        <div
          id="duration"
          class="stat-value"
        >
          -
        </div>

      </div>

    </div>


    <div
      id="fareBasis"
      class="fare-basis"
    ></div>

  </div>


  <div class="footer">

    Community Fare Checker • Brunei<br>

    Standard community reference fare

  </div>

</div>


<script>

/*
==========================================================
CURRENT SERVICE
==========================================================
*/

let currentService = "runner";


/*

Each location has a standard reference point.

The reference point is used for calculating actual road
distance through OSRM.
==========================================================
*/

const kampongs = [

  },

  },

  {

  {
    name: "Lumut",

  },

  {

  {

  },

  {

  },

  {
    name: "Panaga",
    zone: "BELAIT",
    lat: 4.6400,
    lon: 114.3400
  },

  {
    name: "Sungai Teraban",
    zone: "BELAIT",
    lat: 4.5700,
    lon: 114.1800
  },

  {
    name: "Labi",
    zone: "BELAIT",
    lat: 4.4800,
    lon: 114.5000
  }

];


/*
==========================================================
SORT
==========================================================
*/

kampongs.sort((a, b) =>
  a.name.localeCompare(b.name)
);


/*
==========================================================
POPULATE DROPDOWNS
==========================================================
*/

const pickupSelect =
  document.getElementById("pickup");

const destinationSelect =
  document.getElementById("destination");


kampongs.forEach(kampong => {

  const option1 =
    document.createElement("option");

  option1.value =
    kampong.name;

  option1.textContent =
    kampong.name;


  const option2 =
    document.createElement("option");

  option2.value =
    kampong.name;

  option2.textContent =
    kampong.name;


  pickupSelect.appendChild(option1);

  destinationSelect.appendChild(option2);

});


/*
==========================================================
GET KAMPONG
==========================================================
*/

function getKampong(name) {

  return kampongs.find(
    k => k.name === name
  );

}


/*
==========================================================
SERVICE SELECTOR
==========================================================
*/

function selectService(service) {

  currentService = service;


  const runnerButton =
    document.getElementById("runnerButton");

  const rideButton =
    document.getElementById("rideButton");

  const calculateButton =
    document.getElementById("calculateButton");


  runnerButton.classList.remove("active");

  rideButton.classList.remove("active");


  if (service === "runner") {

    runnerButton.classList.add("active");

    calculateButton.textContent =
      "Calculate Runner Fare";

  }

  else {

    rideButton.classList.add("active");

    calculateButton.textContent =
      "Calculate Personal Ride Fare";

  }

}


/*
==========================================================
FARE CALCULATION

BSB:

RUNNER
Minimum $5
Maximum $10

PERSONAL RIDE
Minimum $5
Maximum $15


The formula below gives the BASE fare.

The BSB maximum is then applied.

NO $0.50 ROUNDING.
==========================================================
*/

function calculateFareAmount(
  distanceKm,
  service,
  isBSB
) {

  let fare;


  /*
  ----------------------------------------
  RUNNER
  ----------------------------------------
  */

  if (service === "runner") {

    if (distanceKm <= 5) {

      fare = 5;

    }

    else if (distanceKm <= 20) {

      fare =
        distanceKm * 0.40;

    }

    else {

      fare =
        distanceKm * 0.65;

    }


    fare =
      Math.max(5, fare);


    /*
    BSB MAXIMUM
    */

    if (isBSB) {

      fare =
        Math.min(10, fare);

    }

  }


  /*
  ----------------------------------------
  PERSONAL RIDE
  ----------------------------------------
  */

  else {

    if (distanceKm <= 5) {

      fare = 5;

    }

    else if (distanceKm <= 20) {

      fare =
        distanceKm * 0.42;

    }

    else {

      fare =
        distanceKm * 0.70;

    }


    fare =
      Math.max(5, fare);


    /*
    BSB MAXIMUM
    */

    if (isBSB) {

      fare =
        Math.min(15, fare);

    }

  }


  /*
  ----------------------------------------
  SHOW TO NEAREST 10 CENTS

  Example:
  6.37 → 6.40
  8.02 → 8.00

  No 50-cent restriction.
  ----------------------------------------
  */

  fare =
    Math.round(fare * 10) / 10;


  return fare;

}


/*
==========================================================
FORMAT TIME
==========================================================
*/

function formatDuration(seconds) {

  const minutes =
    Math.round(seconds / 60);


  if (minutes < 1) {

    return "<1 min";

  }


  if (minutes < 60) {

    return minutes + " min";

  }


  const hours =
    Math.floor(minutes / 60);

  const remaining =
    minutes % 60;


  if (remaining === 0) {

    return hours + " hr";

  }


  return (
    hours +
    " hr " +
    remaining +
    " min"
  );

}


/*
==========================================================
OSRM ROAD ROUTING

NO MAP.

NO ROUTE DISPLAY.

Only distance + duration are requested.

overview=false prevents route geometry from being returned.
==========================================================
*/

async function getRoadRoute(
  pickup,
  destination
) {

  const coordinates =
    `${pickup.lon},${pickup.lat};${destination.lon},${destination.lat}`;


  const url =
    `https://router.project-osrm.org/route/v1/driving/${coordinates}` +
    `?overview=false` +
    `&steps=false` +
    `&alternatives=false`;


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "Routing service error."
    );

  }


  const data =
    await response.json();


  if (
    data.code !== "Ok" ||
    !data.routes ||
    !data.routes.length
  ) {

    throw new Error(
      "No driving route found."
    );

  }


  return data.routes[0];

}


/*
==========================================================
MAIN CALCULATION
==========================================================
*/

async function calculateFare() {

  const pickupName =
    pickupSelect.value;

  const destinationName =
    destinationSelect.value;


  const error =
    document.getElementById("error");

  const result =
    document.getElementById("result");

  const loading =
    document.getElementById("loading");

  const button =
    document.getElementById("calculateButton");


  error.style.display =
    "none";


  /*
  ----------------------------------------
  VALIDATION
  ----------------------------------------
  */

  if (
    !pickupName ||
    !destinationName
  ) {

    error.textContent =
      "Please select both pickup and destination kampongs.";

    error.style.display =
      "block";

    return;

  }


  if (
    pickupName === destinationName
  ) {

    error.textContent =
      "Pickup and destination cannot be the same kampong.";

    error.style.display =
      "block";

    return;

  }


  const pickup =
    getKampong(pickupName);

  const destination =
    getKampong(destinationName);


  if (
    !pickup ||
    !destination
  ) {

    error.textContent =
      "Unable to find the selected kampong.";

    error.style.display =
      "block";

    return;

  }


  /*
  ----------------------------------------
  DETERMINE ZONE
  ----------------------------------------

  BSB maximum applies when both locations
  are within the BSB zone.
  ----------------------------------------
  */

  const isBSB =
    pickup.zone === "BSB" &&
    destination.zone === "BSB";


  /*
  ----------------------------------------
  LOADING
  ----------------------------------------
  */

  loading.style.display =
    "block";

  button.disabled =
    true;

  button.style.opacity =
    "0.6";

  result.style.display =
    "none";


  try {

    /*
    --------------------------------------
    ACTUAL ROAD ROUTE
    --------------------------------------
    */

    const route =
      await getRoadRoute(
        pickup,
        destination
      );


    const distanceKm =
      route.distance / 1000;


    /*
    --------------------------------------
    FARE
    --------------------------------------
    */

    const fare =
      calculateFareAmount(
        distanceKm,
        currentService,
        isBSB
      );


    /*
    --------------------------------------
    DISPLAY SERVICE
    --------------------------------------
    */

    document.getElementById(
      "serviceResult"
    ).textContent =
      currentService === "runner"
        ? "📦 RUNNER"
        : "🚗 PERSONAL RIDE";


    /*
    --------------------------------------
    DISPLAY ROUTE
    --------------------------------------
    */

    document.getElementById(
      "pickupName"
    ).textContent =
      pickup.name;


    document.getElementById(
      "destinationName"
    ).textContent =
      destination.name;


    /*
    --------------------------------------
    DISTANCE
    --------------------------------------
    */

    document.getElementById(
      "distance"
    ).textContent =
      distanceKm.toFixed(1) +
      " km";


    /*
    --------------------------------------
    TIME
    --------------------------------------
    */

    document.getElementById(
      "duration"
    ).textContent =
      formatDuration(
        route.duration
      );


    /*
    --------------------------------------
    FARE
    --------------------------------------
    */

    document.getElementById(
      "fare"
    ).textContent =
      "BND $" +
      fare.toFixed(2);


    /*
    --------------------------------------
    FARE BASIS TEXT
    --------------------------------------
    */

    let basisText;


    if (
      currentService === "runner"
    ) {

      basisText =
        "Runner: $5 minimum.";

      if (isBSB) {

        basisText +=
          " BSB maximum: $10.";

      }

    }

    else {

      basisText =
        "Personal Ride: $5 minimum.";

      if (isBSB) {

        basisText +=
          " BSB maximum: $15.";

      }

    }


    if (!isBSB) {

      basisText +=
        " Non-BSB routes use the distance-based fare without the BSB maximum.";

    }


    document.getElementById(
      "fareBasis"
    ).innerHTML =
      "<strong>Fare basis:</strong><br>" +
      basisText +
      "<br>Actual road distance used. " +
      "Fare is calculated to the nearest $0.10.";


    /*
    --------------------------------------
    SHOW RESULT
    --------------------------------------
    */

    result.style.display =
      "block";


    result.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }


  catch (err) {

    console.error(err);


    error.textContent =
      "Unable to calculate the road distance right now. Please try again.";

    error.style.display =
      "block";

  }


  finally {

    loading.style.display =
      "none";

    button.disabled =
      false;

    button.style.opacity =
      "1";

  }

}


/*
==========================================================
SWAP LOCATIONS
==========================================================
*/

function swapLocations() {

  const pickup =
    pickupSelect.value;

  const destination =
    destinationSelect.value;


  pickupSelect.value =
    destination;

  destinationSelect.value =
    pickup;

}

</script>

</body>
</html>
